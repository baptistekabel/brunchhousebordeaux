services:
  - type: web
    name: brunch-house-bordeaux
    env: static
    buildCommand: npm run build
    staticPublishPath: build
    routes:
      # Une page HTML statique par URL (générée par scripts/generate-seo-pages.js).
      # Pas de rewrite global : les URLs inexistantes renvoient une vraie 404.
      - type: rewrite
        source: /mentions-legales
        destination: /mentions-legales/index.html
      - type: rewrite
        source: /mentions-legales/
        destination: /mentions-legales/index.html
      - type: rewrite
        source: /menu
        destination: /menu/index.html
      - type: rewrite
        source: /menu/
        destination: /menu/index.html
      - type: rewrite
        source: /en
        destination: /en/index.html
      - type: rewrite
        source: /en/
        destination: /en/index.html
      - type: rewrite
        source: /en/menu
        destination: /en/menu/index.html
      - type: rewrite
        source: /en/menu/
        destination: /en/menu/index.html
      - type: rewrite
        source: /es
        destination: /es/index.html
      - type: rewrite
        source: /es/
        destination: /es/index.html
      - type: rewrite
        source: /es/menu
        destination: /es/menu/index.html
      - type: rewrite
        source: /es/menu/
        destination: /es/menu/index.html
    headers:
      - path: /*
        headers:
          - key: X-Frame-Options
            value: DENY
          - key: X-Content-Type-Options
            value: nosniff
          - key: X-XSS-Protection
            value: "1; mode=block"
          - key: Referrer-Policy
            value: strict-origin-when-cross-origin
      - path: /static/*
        headers:
          - key: Cache-Control
            value: public, max-age=31536000, immutable
      - path: "*.js"
        headers:
          - key: Cache-Control
            value: public, max-age=31536000, immutable
      - path: "*.css"
        headers:
          - key: Cache-Control
            value: public, max-age=31536000, immutable
      - path: "*.png"
        headers:
          - key: Cache-Control
            value: public, max-age=2592000
      - path: "*.jpg"
        headers:
          - key: Cache-Control
            value: public, max-age=2592000
      - path: "*.jpeg"
        headers:
          - key: Cache-Control
            value: public, max-age=2592000
      - path: "*.webp"
        headers:
          - key: Cache-Control
            value: public, max-age=2592000